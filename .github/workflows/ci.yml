name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: MCP server smoke test
        run: |
          cargo build -p todo-cli
          TODO_NO_NOTIFY=1 TODO_DB="$RUNNER_TEMP/smoke.db" python3 scripts/mcp_smoke.py target/debug/todo
      - name: Build the app
        run: PROFILE=dev ./scripts/build-core.sh && (cd app && swift build)
